# 온프레미스 인사팀 RAG — 비-LLM 서비스 스택
# vLLM(생성 LLM)은 이 compose에 포함하지 않는다. 이미 별도로 기동 중이며 .env의 VLLM_BASE_URL로 연결한다.
#
# GPU 서비스(TEI embed/rerank)는 단일 카드를 vLLM과 공유하므로 VRAM 상한에 주의한다(docs/vram.md).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # 임베딩: KURE-v1(한국어 특화, BGE-M3 기반, 568M ~2-3GB). dense는 이 모델, sparse는 Qdrant BM25.
  embedding:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:latest}
    restart: unless-stopped
    command: ["--model-id", "${EMBEDDING_MODEL:-nlpai-lab/KURE-v1}", "--port", "80"]
    ports:
      - "${EMBEDDING_PORT:-8081}:80"
    volumes:
      - hf_cache:/data
      - ./models:/models:ro          # 폐쇄망: 미리 받은 모델을 로컬 경로로 마운트
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}   # 폐쇄망 배포 시 1 (사전 다운로드 필요)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # bge-reranker-v2-m3: 가볍고 안전한 다국어 크로스인코더. 568M, ~2-3GB VRAM.
  reranker:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:latest}
    restart: unless-stopped
    command: ["--model-id", "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}", "--port", "80"]
    ports:
      - "${RERANKER_PORT:-8082}:80"
    volumes:
      - hf_cache:/data
      - ./models:/models:ro          # 폐쇄망: 미리 받은 모델을 로컬 경로로 마운트
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      # ── CPU 로 돌 때만: 코어를 다 쓰게 하기 ───────────────────────────────
      # 리랭커는 크로스 인코더라 후보마다 모델을 한 번씩 돌린다. 코어를 하나만 쓰면
      # 그만큼 느려진다. 아래로 확인하고, 100% 근처면 두 줄의 주석을 풀 것:
      #   docker stats --no-stream reranker    # CPU% 가 100 근처 = 1코어만 사용 중
      #   nproc                                # 이 서버의 코어 수
      # 숫자는 nproc 결과로 바꾼다. 값을 비워 두면 안 된다(빈 값이 1로 해석될 수 있음).
      # GPU 로 도는 중이면 아무 효과 없다 — 건드리지 말 것.
      # OMP_NUM_THREADS: "16"
      # RAYON_NUM_THREADS: "16"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

volumes:
  pgdata:
  qdrantdata:
  miniodata:
  hf_cache:
