[project]
name = "data-gov"
version = "0.0.1"
description = "온프레미스 인사팀 RAG 시스템 (거버넌스 우선 적재)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ingest = [
    "openpyxl>=3.1",     # xlsx
    "python-docx>=1.1",  # docx
    "python-pptx>=0.6",  # pptx
    "pymupdf>=1.24",     # pdf (텍스트 레이어)
    "httpx>=0.27",       # vLLM / TEI HTTP 클라이언트
    "qdrant-client>=1.9",
]
postgres = [
    "psycopg[binary]>=3.1",  # 운영 DB 드라이버(테스트는 SQLite라 불필요)
]
ui = [
    "streamlit>=1.36",       # 적재 검토 UI
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# repo 루트를 sys.path에 추가 → `pytest`(직접 실행)에서도 app/scripts 임포트 가능
# (`python -m pytest`는 cwd를 넣지만 `pytest`는 안 넣기 때문)
pythonpath = ["."]
