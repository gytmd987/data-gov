# CPU 전용 스택 (GPU 없이, 또는 Blackwell TEI GPU 이미지 비호환 시 사용).
# 임베딩·리랭커(568M 소형)를 CPU로 돌린다 — 30명 규모엔 충분(조금 느릴 뿐).
# 사용: docker compose -f docker-compose.cpu.yml up -d
#
# vLLM(생성 LLM)은 여전히 별도 기동 필요(.env의 VLLM_BASE_URL). 이 파일엔 포함하지 않는다.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # 임베딩: KURE-v1. CPU 이미지(GPU 예약 없음).
  embedding:
    image: ${TEI_IMAGE_CPU:-ghcr.io/huggingface/text-embeddings-inference:cpu-latest}
    restart: unless-stopped
    command: ["--model-id", "${EMBEDDING_MODEL:-nlpai-lab/KURE-v1}", "--port", "80"]
    ports:
      - "${EMBEDDING_PORT:-8081}:80"
    volumes:
      - hf_cache:/data
      - ./models:/models:ro          # 폐쇄망: 미리 받은 모델을 로컬 경로로 마운트
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}

  # 리랭커: bge-reranker-v2-m3. CPU 이미지.
  reranker:
    image: ${TEI_IMAGE_CPU:-ghcr.io/huggingface/text-embeddings-inference:cpu-latest}
    restart: unless-stopped
    command: ["--model-id", "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}", "--port", "80"]
    ports:
      - "${RERANKER_PORT:-8082}:80"
    volumes:
      - hf_cache:/data
      - ./models:/models:ro          # 폐쇄망: 미리 받은 모델을 로컬 경로로 마운트
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}

volumes:
  pgdata:
  qdrantdata:
  miniodata:
  hf_cache:
