# ═══════════════════════════════════════════════════════════════════════════
#  인사 RAG 시스템 중앙 설정 파일
#  메타데이터 어휘 · 조직 역할 · 관리자 · 화면 라벨을 여기서 관리합니다.
#  값을 바꾸고 서비스를 재시작하면 검토 UI 드롭다운·라벨이 자동 반영됩니다.
#  접근 통제는 조직도(팀>그룹>파트)로 하며, 민감도 등급/PII는 사용하지 않습니다.
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  # ── 문서 종류 (검토 UI 드롭다운) ── 값은 영문 토큰, 화면 표시는 아래 labels 로.
  doc_types:
    - report          # 보고서
    - meeting_note    # 회의록
    - presentation    # 발표자료
    - manual          # 매뉴얼
    - notice          # 공지사항
    - policy          # 정책
    - regulation      # 규정
    - guideline       # 지침
    - form            # 양식/서식
    - contract        # 계약서
    - email           # 이메일
    - messenger       # 메신저
    - approval        # 품의
    - other           # 기타
    - unknown         # LLM이 확신 못 함 → 사람 확인 필요 (이 값은 남겨두세요)

  # ── 문서 종류 판별 기준 ── AI 자동 분류 프롬프트에 그대로 들어갑니다.
  #    분류가 자꾸 틀리는 종류가 있으면 여기 설명·예시를 고치세요(코드 수정 불필요).
  doc_type_hints:
    report: 사실·결과·현황을 보고하는 문서. 제목에 '보고', '결과', '현황', '(안)', '계획'
      이 들어가면 대개 여기. 사내 검토·승인을 받으려고 쓴 문서도 포함.
    meeting_note: 회의에서 오간 논의·결정 사항을 적은 기록. '회의록', '미팅노트'.
    presentation: 발표용 슬라이드. 장표 형태로 구성된 자료.
    manual: 시스템·업무 사용법을 단계별로 안내하는 문서. '사용법', '가이드', '매뉴얼'.
    notice: 임직원에게 알리는 공지·안내문. '공지', '안내'.
    policy: 회사 차원의 방침·기준. '정책'.
    regulation: 사규·취업규칙처럼 조문(제1조, 제2조…) 형식으로 된 규정.
    guideline: 업무 수행 기준·권고 사항. '지침', '기준'.
    form: 빈칸을 채워 쓰는 서식·템플릿. '양식', '신청서 서식'.
    contract: 둘 이상의 당사자가 서명해 의무를 지는 계약 문서. '계약서', '협약서',
      '약정서'. **당사자·서명란·계약 조항이 실제로 있을 때만** 고르세요.
      회사 설립·조직 신설 같은 '내부 검토·보고 문서'는 계약서가 아니라 report 입니다.
    email: 주고받은 이메일.
    messenger: 메신저 대화 기록.
    approval: 결재를 올리는 품의서·기안문. '품의', '기안', '결재 요청'.
    other: 위 어디에도 맞지 않는 문서.
    unknown: 내용이 부족해 판단할 수 없을 때만.

  # ── 제목 정리 규칙 ── 파일명을 문서 제목으로 쓸 때 걷어낼 잡음.
  #    부서 말머리(예: [인사팀])와 괄호 표기(예: (안))는 의미가 있으므로 보존합니다.
  title_cleanup:
    # 제목 **끝**에 붙은 버전·상태 꼬리표. 끝에서만 지우므로 '최종 평가 지침' 같은
    # 진짜 제목은 건드리지 않습니다. (v3, rev2 등 버전 번호는 코드가 따로 처리)
    noise_suffixes:
      - 최종본
      - 최종
      - 진짜최종
      - 수정본
      - 수정
      - 초안
      - 완료
      - final
      - fin
      - draft
      - latest
      - new
      - 백업
      - backup
      - 원본
    # 제목 **앞**에 붙은 복사 흔적(윈도우·드라이브가 자동으로 붙이는 것).
    copy_prefixes:
      - 사본
      - 복사본
      - copy of
      - copy
    # 제목 어디에 있든 지울 장식 문자.
    decorations: "★☆■□◆◇▶▷●○※◈♠♥♣◎▣▲△▼"
    # 파일명이 이것들 중 하나면 내용을 알 수 없다고 보고 AI 제안 제목을 씁니다.
    # (뒤에 숫자가 붙은 '붙임1', '첨부2' 도 자동으로 포함됩니다)
    uninformative:
      - 새문서
      - 새 문서
      - 무제
      - 제목없음
      - 제목 없음
      - 문서
      - document
      - 새파일
      - 새 파일
      - untitled
      - noname
      - scan
      - 이미지
      - 붙임
      - 별첨
      - 첨부
      - 별지
      - 참고자료
      - 신규문서
    # 이 말 뒤에 오는 6·8자리 숫자는 날짜가 아니라 식별번호로 봅니다(오탐 방지).
    not_a_date_after:
      - 사번
      - 사원번호
      - 학번
      - 번호
      - 코드
      - 전화
      - 연락처
      - "no"
      - "no."
      - "#"

  # ── 작성 부서 후보 ── 조직도가 우선이며, 조직도 밖 부서를 쓸 때의 보조 목록.
  departments:
    - 인사팀
    - 경영지원팀
    - 재무팀
    - 총무팀
    - 법무팀
    - 기타

# ── 화면 표시용 한글 라벨 ── 값(영문)→한글. 폼 전송 값은 영문 그대로 유지되고
#    UI에 보이는 글자만 여기서 바뀝니다. 목록에 없는 값은 원값 그대로 표시.
labels:
  # 문서 종류
  report: 보고서
  meeting_note: 회의록
  presentation: 발표자료
  manual: 매뉴얼
  notice: 공지사항
  policy: 정책
  regulation: 규정
  guideline: 지침
  form: 양식
  contract: 계약서
  email: 이메일
  messenger: 메신저
  approval: 품의
  other: 기타
  unknown: 미분류(확인 필요)
  # 문서 형식(파일)
  docx: 워드
  pptx: 파워포인트
  xlsx: 엑셀
  pdf: PDF
  txt: TXT
  jpg: 이미지
  png: 이미지
  # 언어
  ko: 한국어
  en: 영어
  mixed: 혼합
  # 생애주기 상태
  draft: 초안(색인 불가)
  active: 유효
  superseded: 대체됨
  expired: 만료
  archived: 보관
  # 접근
  "*": 팀 전체
  # 조직 노드 유형
  team: 팀
  group: 그룹
  part: 파트

permissions:
  # ── 관리자 이메일 ── SSO 로그인 이메일 기준. 이 목록의 사람만 관리 콘솔 접근.
  #   비어 있으면 인증 미설정(개발) 시 전체 허용. 운영에서는 반드시 채우세요.
  admins:
    - admin@company.com

  # ── 조직 역할 ── 조직도 노드에 배정되는 역할. 팀장/그룹장/파트장은 '부서장'(head)으로
  #   자기 부서 문서를 관리할 수 있고, 파트원은 등록·요청만 가능하다. (순서·이름 고정 권장)
  org_roles:
    - 팀장
    - 그룹장
    - 파트장
    - 파트원
