# ═══════════════════════════════════════════════════════════════════════════
#  인사 RAG 시스템 중앙 설정 파일
#  메타데이터 어휘 · 조직 역할 · 관리자 · 화면 라벨을 여기서 관리합니다.
#  값을 바꾸고 서비스를 재시작하면 검토 UI 드롭다운·라벨이 자동 반영됩니다.
#  접근 통제는 조직도(팀>그룹>파트)로 하며, 민감도 등급/PII는 사용하지 않습니다.
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  # ── 문서 종류 (검토 UI 드롭다운) ── 값은 영문 토큰, 화면 표시는 아래 labels 로.
  doc_types:
    - report          # 보고서
    - meeting_note    # 회의록
    - presentation    # 발표자료
    - manual          # 매뉴얼
    - notice          # 공지사항
    - email           # 이메일
    - messenger       # 메신저
    - approval        # 품의
    - other           # 기타
    - unknown         # LLM이 확신 못 함 → 사람 확인 필요 (이 값은 남겨두세요)

  # ── 작성 부서 후보 ── 조직도가 우선이며, 조직도 밖 부서를 쓸 때의 보조 목록.
  departments:
    - 인사팀
    - 경영지원팀
    - 재무팀
    - 총무팀
    - 법무팀
    - 기타

# ── 화면 표시용 한글 라벨 ── 값(영문)→한글. 폼 전송 값은 영문 그대로 유지되고
#    UI에 보이는 글자만 여기서 바뀝니다. 목록에 없는 값은 원값 그대로 표시.
labels:
  # 문서 종류
  report: 보고서
  meeting_note: 회의록
  presentation: 발표자료
  manual: 매뉴얼
  notice: 공지사항
  email: 이메일
  messenger: 메신저
  approval: 품의
  other: 기타
  unknown: 미분류(확인 필요)
  # 문서 형식(파일)
  docx: 워드
  pptx: 파워포인트
  xlsx: 엑셀
  pdf: PDF
  txt: TXT
  jpg: 이미지
  png: 이미지
  # 언어
  ko: 한국어
  en: 영어
  mixed: 혼합
  # 생애주기 상태
  draft: 초안(색인 불가)
  active: 유효
  superseded: 대체됨
  expired: 만료
  archived: 보관
  # 접근
  "*": 팀 전체
  # 조직 노드 유형
  team: 팀
  group: 그룹
  part: 파트

permissions:
  # ── 관리자 이메일 ── SSO 로그인 이메일 기준. 이 목록의 사람만 관리 콘솔 접근.
  #   비어 있으면 인증 미설정(개발) 시 전체 허용. 운영에서는 반드시 채우세요.
  admins:
    - admin@company.com

  # ── 조직 역할 ── 조직도 노드에 배정되는 역할. 팀장/그룹장/파트장은 '부서장'(head)으로
  #   자기 부서 문서를 관리할 수 있고, 파트원은 등록·요청만 가능하다. (순서·이름 고정 권장)
  org_roles:
    - 팀장
    - 그룹장
    - 파트장
    - 파트원
