# ═══════════════════════════════════════════════════════════════════════════
#  인사 RAG 시스템 중앙 설정 파일
#  이 한 파일에서 메타데이터 · 거버넌스 · 권한을 모두 관리합니다.
#  값을 바꾸고 서비스를 재시작하면 검토 UI 드롭다운과 검증 규칙이 자동 반영됩니다.
#  (코드 수정 불필요 — 자세한 방법: docs/설정_가이드.md)
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  # ── 문서 유형 (검토 UI 드롭다운) ── 추가/삭제 자유. 영문 소문자+언더스코어 권장.
  doc_types:
    - policy          # 인사 규정/정책
    - contract        # 계약
    - payroll         # 급여
    - evaluation      # 평가
    - recruiting      # 채용
    - training        # 교육
    - attendance      # 근태
    - org_chart       # 조직도/인원현황
    - meeting_note    # 회의록
    - report          # 보고서/통계
    - form_template   # 양식/서식
    - other           # 기타
    - unknown         # LLM이 확신 못 함 → 사람 확인 필요 (이 값은 남겨두는 것을 권장)

  # ── 민감도 등급 ── 위에서 아래로 갈수록 높음. 순서가 곧 등급이며 사용자 clearance와 비교됨.
  #    (등급 자체를 바꾸는 일은 드묾. 순서를 지켜서 편집하세요.)
  sensitivity_levels:
    - public          # 사내 전체 공개
    - internal        # 인사팀 등 특정 그룹
    - confidential    # 제한된 담당자
    - restricted      # 최고 민감(급여·평가·개인정보)

  # ── 개인정보(PII) 유형 ──
  pii_types:
    - name            # 이름
    - resident_id     # 주민등록번호
    - contact         # 연락처/이메일/주소
    - salary          # 급여/보상
    - evaluation      # 평가 결과
    - health          # 건강/의료
    - family          # 가족관계
    - account         # 계좌/금융
    - other

  # ── 주제 태그(controlled) ── 비워두면([]) 자유 태그 허용(검증 안 함).
  topics:
    - 연차
    - 급여
    - 평가
    - 채용
    - 근태
    - 교육
    - 복리후생
    - 규정

governance:
  # ── 색인 전 사람이 반드시 확정해야 하는 필드 ── 미충족 시 적재 차단(BLOCKED).
  required_fields:
    - sensitivity_level
    - contains_pii
    - access_groups
    - owner

permissions:
  # ── 접근 그룹 ── 문서에 붙는 라벨이자 사용자에게 부여되는 권한 단위.
  access_groups:
    - hr_core         # 인사팀 공통
    - payroll         # 급여
    - recruiting      # 채용
    - evaluation      # 평가

  # ── 직책(position) ── 조직 내 계급. 자유롭게 편집.
  positions:
    - 사원
    - 대리
    - 과장
    - 차장
    - 부장

  # ── 직무(job) ── 담당 업무. 자유롭게 편집.
  jobs:
    - 일반
    - 급여
    - 채용
    - 평가

  # ── 권한 규칙 ── (직책, 직무) 조합 → 접근그룹 + 최대 열람 민감도(clearance)
  #   매칭되는 모든 규칙의 groups를 합치고, clearance는 그중 가장 높은 등급을 취합니다.
  #   positions/jobs 에 ["*"] 를 쓰면 전체를 의미합니다.
  #   예) 같은 '급여' 직무라도 사원은 confidential, 차장/부장은 restricted (직책에 따라 다름)
  #       같은 '부장' 직책이라도 급여 직무는 payroll 그룹, 채용 직무는 recruiting 그룹 (직무에 따라 다름)
  rules:
    - name: 인사팀 기본 열람
      positions: ["*"]
      jobs: ["*"]
      groups: [hr_core]
      clearance: internal

    - name: 급여 담당
      positions: ["*"]
      jobs: [급여]
      groups: [payroll]
      clearance: confidential

    - name: 급여 관리자(차장 이상)
      positions: [차장, 부장]
      jobs: [급여]
      groups: [payroll]
      clearance: restricted

    - name: 채용 담당
      positions: ["*"]
      jobs: [채용]
      groups: [recruiting]
      clearance: confidential

    - name: 평가 담당
      positions: ["*"]
      jobs: [평가]
      groups: [evaluation]
      clearance: confidential

    - name: 부서장(부장) 확대 열람
      positions: [부장]
      jobs: ["*"]
      clearance: confidential
