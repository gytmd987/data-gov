<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}인사 어시스턴트{% endblock %}</title>
<style>
:root{
  /* 구조(배경·선·보조텍스트)는 **중립 회색**으로 둔다. 전에는 전부 푸른 기가 돌아
     화면이 온통 파랗고 흐릿했다. 파랑은 '누를 수 있는 것'에만 쓴다. */
  --bg:#f2f3f5; --panel:#ffffff; --bg-soft:#f8f9fa;
  --line:#dcdee3; --line-strong:#b5b9c2;
  --txt:#14161a; --txt2:#31343b; --sub:#5b6068;   /* 보조 텍스트도 충분히 진하게 */

  /* 강조(링크·기본 버튼·선택 상태) — 중립 배경 위에서 또렷하게 */
  --accent:#1d4ed8; --accent-hover:#1e40af; --accent-weak:#eaf0fe; --accent-line:#a9c2f7;

  /* 상태색 — 목록·배지에서 서로 구분되도록 색상군을 벌린다 */
  --ok:#0b7a43; --ok-weak:#e6f5ed; --ok-line:#a6dcc0;
  --warn:#9a5b06; --warn-bg:#fff7e6; --warn-line:#f3d18a;
  --danger:#c62828; --danger-weak:#fdebeb; --danger-line:#f0b7b7;
  --neutral-weak:#eceef1; --neutral-line:#d3d7de;

  --radius:10px; --radius-lg:14px;
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 1px 3px rgba(20,22,26,.08);
  --shadow-lg:0 10px 28px rgba(20,22,26,.14);
  --fs:14px;      /* 본문 기준 */
  --fs-sm:13px;   /* 보조 */
  --fs-xs:12px;   /* 라벨·배지 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
     background:var(--bg);color:var(--txt);font-size:var(--fs);line-height:1.55;
     -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h2{font-size:20px;font-weight:700;letter-spacing:-.2px}
h4{font-size:14px;font-weight:650;margin-bottom:6px;color:var(--txt)}
b,strong{font-weight:650}

/* ── 아이콘(인라인 SVG 스프라이트) ─────────────────────────────────────── */
.ic{width:17px;height:17px;flex:none;vertical-align:-3px;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px;vertical-align:-2px}

/* ── 상단바 ─────────────────────────────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;background:var(--panel);
        border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar .brand{font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;color:var(--txt)}
.topbar .brand .ic{width:19px;height:19px;stroke:var(--accent)}
.topbar .nav{display:flex;gap:2px}
.topbar .nav a{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;
               color:var(--sub);font-size:var(--fs-sm);font-weight:500}
.topbar .nav a:hover{background:var(--neutral-weak);color:var(--txt);text-decoration:none}
.topbar .nav a.on{background:var(--accent);color:#fff;font-weight:600}
.topbar .nav a.on:hover{background:var(--accent-hover);color:#fff}
.topbar .me{margin-left:auto;color:var(--sub);font-size:var(--fs-sm);display:flex;align-items:center;gap:8px}

/* ── 버튼 ───────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     padding:8px 14px;border:1px solid transparent;border-radius:9px;background:var(--accent);
     color:#fff;cursor:pointer;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;flex-shrink:0;
     font-family:inherit;transition:filter .12s,background .12s,border-color .12s}
.btn:hover{background:var(--accent-hover);text-decoration:none}
.btn:active{filter:brightness(.95)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--panel);color:var(--txt2);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--bg-soft);border-color:var(--sub);color:var(--txt)}
.btn.sm{padding:5px 10px;font-size:var(--fs-xs)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost.danger{background:var(--panel);color:var(--danger);border-color:var(--danger-line)}
.btn.ghost.danger:hover{background:var(--danger-weak);border-color:var(--danger)}

/* ── 입력 요소(크기·굵기 통일) ─────────────────────────────────────────── */
input,select,textarea,button{font-family:inherit}
input,select,textarea{font-size:var(--fs-sm);padding:7px 10px;border:1px solid var(--line-strong);
                      border-radius:8px;width:100%;background:var(--panel);color:var(--txt);
                      transition:border-color .12s,box-shadow .12s}
input::placeholder,textarea::placeholder{color:#9298a2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
                                        box-shadow:0 0 0 3px rgba(29,78,216,.16)}
input[type=checkbox],input[type=radio]{width:auto;padding:0;accent-color:var(--accent)}
input[type=file]{padding:6px 8px;background:var(--bg);border-style:dashed;cursor:pointer}
label{font-size:var(--fs-sm)}
/* select 은 '고르는 칸'임이 분명히 보이도록 화살표 + 옅은 배경 */
select{appearance:none;-webkit-appearance:none;padding-right:30px;cursor:pointer;
       background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
       background-repeat:no-repeat;background-position:right 9px center;
       background-color:var(--panel)}
select:hover{border-color:var(--line-strong);background-color:var(--bg-soft)}
select:focus{background-color:var(--panel)}
.field{margin:10px 0}
.field>label{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--sub);margin-bottom:5px;
             letter-spacing:.1px}

/* 체크박스 드롭다운(다중 선택) — <details class="dd"> */
.dd{position:relative}
.dd>summary{list-style:none;cursor:pointer;padding:7px 30px 7px 10px;border:1px solid var(--line-strong);
            border-radius:8px;background:var(--panel);font-size:var(--fs-sm);white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis}
.dd>summary:hover{background:var(--bg-soft);border-color:var(--line-strong)}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary::after{content:"";position:absolute;right:10px;top:50%;width:14px;height:14px;
  margin-top:-7px;background-repeat:no-repeat;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>")}
.dd .menu{position:absolute;z-index:30;left:0;right:0;margin-top:4px;background:var(--panel);
          border:1px solid var(--line);border-radius:10px;max-height:230px;overflow-y:auto;
          box-shadow:var(--shadow-lg);padding:5px}
.dd .menu label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;
                cursor:pointer;font-size:var(--fs-sm);white-space:nowrap}
.dd .menu label:hover{background:var(--accent-weak)}
/* 상위 부서를 골라 자동 포함된 하위 — 흐리게 두고 이유를 붙인다 */
.dd .menu label.covered{color:var(--sub);cursor:default}
.dd .menu label.covered:hover{background:transparent}
.dd .menu label .incl{margin-left:auto;font-size:var(--fs-xs);color:var(--accent);
                      background:var(--accent-weak);border-radius:5px;padding:1px 6px}

/* ── 표 ─────────────────────────────────────────────────────────────────── */
table{border-collapse:separate;border-spacing:0;width:100%;background:var(--panel);
      border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th,td{padding:9px 12px;font-size:var(--fs-sm);text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--bg-soft);color:var(--txt2);font-weight:700;font-size:var(--fs-xs);
   letter-spacing:.2px;border-bottom:1px solid var(--line-strong)}
tr:last-child td{border-bottom:none}
tbody tr:hover td,table tr:hover td{background:var(--bg-soft)}

/* ── 카드·기타 ──────────────────────────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
      padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.msg-note{color:var(--sub);font-size:var(--fs-sm)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-weak);
      border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;
      padding:2px 10px;font-size:var(--fs-xs)}
.tag{display:inline-block;background:var(--neutral-weak);border:1px solid var(--neutral-line);border-radius:999px;
     padding:2px 10px;font-size:var(--fs-xs);color:var(--txt2)}
/* 상태 배지 — 목록에서 유효/보관/만료가 한눈에 구분되도록 색을 벌린다 */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;
    font-size:var(--fs-xs);font-weight:600;border:1px solid transparent;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-active{background:var(--ok-weak);border-color:var(--ok-line);color:var(--ok)}
.st-archived{background:var(--neutral-weak);border-color:var(--neutral-line);color:var(--sub)}
.st-expired{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.st-superseded{background:var(--danger-weak);border-color:var(--danger-line);color:var(--danger)}
.st-draft{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent)}

.banner{border-radius:var(--radius);padding:11px 14px;font-size:var(--fs-sm)}
.banner.info{background:var(--accent-weak);border:1px solid var(--accent-line);color:#1b3fa8}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
</style>
{% block head %}{% endblock %}
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="i-brand" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/><path d="M9 10h.01M15 10h.01M9 13h.01M15 13h.01"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.9L3 21l1.9-4.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></symbol>
  <symbol id="i-org" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="5" rx="1.2"/><rect x="2" y="16" width="6" height="5" rx="1.2"/><rect x="16" y="16" width="6" height="5" rx="1.2"/><path d="M12 7v4M5 16v-2h14v2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="3.2"/><path d="M22 20v-1.5a4 4 0 0 0-3-3.8M16.5 3.8a4 4 0 0 1 0 6.4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M12 3v13M7 8l5-5 5 5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M12 16V3M7 11l5 5 5-5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.4 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></symbol>
  <symbol id="i-broom" viewBox="0 0 24 24"><path d="M14 3l7 7M11.5 5.5 18.5 12.5"/><path d="M9 8l7 7-4.5 4.5a3 3 0 0 1-2.1.9H4l1.6-3.2a3 3 0 0 1 .6-.8z"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4"/><path d="M10.5 12.5 21 2M17 6l2.5 2.5M14 9l2.5 2.5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></symbol>
</svg>
<div class="topbar">
  <span class="brand"><svg class="ic"><use href="#i-brand"/></svg>인사 어시스턴트</span>
  <span class="nav">
    <a href="/" class="{% if request.path == '/' %}on{% endif %}"><svg class="ic sm"><use href="#i-chat"/></svg>채팅</a>
    {% if user.is_authenticated %}
    <a href="/console/docs/" class="{% if '/console/docs' in request.path %}on{% endif %}"><svg class="ic sm"><use href="#i-doc"/></svg>문서</a>
    {% endif %}
    {% if is_admin %}
    <a href="/console/org/" class="{% if '/console/org' in request.path %}on{% endif %}"><svg class="ic sm"><use href="#i-org"/></svg>조직도</a>
    <a href="/console/users/" class="{% if '/console/users' in request.path %}on{% endif %}"><svg class="ic sm"><use href="#i-users"/></svg>사용자</a>
    {% endif %}
  </span>
  <span class="me">
    {% if user.is_authenticated %}{{ user.username }}
      <a href="/accounts/password/" class="btn ghost sm"><svg class="ic sm"><use href="#i-key"/></svg>비밀번호</a>
      <form method="post" action="/accounts/logout/" style="display:inline">{% csrf_token %}
        <button class="btn ghost sm"><svg class="ic sm"><use href="#i-logout"/></svg>로그아웃</button></form>
    {% endif %}
  </span>
</div>
{% block content %}{% endblock %}
<script>
// 체크박스 드롭다운: 요약 텍스트 갱신 + 상호 배타(data-exclusive) + 바깥 클릭 시 닫기
document.querySelectorAll('details.dd').forEach(dd => {
  const refresh = () => {
    const names = [...dd.querySelectorAll('input:checked')]
      .map(i => i.closest('label').textContent.trim());
    dd.querySelector('summary').textContent =
      names.length ? names.join(', ') : (dd.dataset.placeholder || '(선택 안 함)');
  };
  // 조직 트리 드롭다운: 상위 부서를 고르면 하위는 자동 포함이므로 따로 못 고르게 한다
  // (둘 다 체크할 수 있으면 "하위도 눌러야 하나?" 하고 헷갈린다)
  const isTree = dd.classList.contains('tree');
  const boxes = () => [...dd.querySelectorAll('input[data-node]')];
  const parentOf = new Map();
  if (isTree) boxes().forEach(b => parentOf.set(b.dataset.node, b.dataset.parent || ''));
  const coveredByAncestor = (node) => {
    let p = parentOf.get(node);
    while (p) {
      const box = dd.querySelector(`input[data-node="${p}"]`);
      if (box && box.checked) return true;
      p = parentOf.get(p);
    }
    return false;
  };
  const syncTree = () => {
    if (!isTree) return;
    boxes().forEach(b => {
      const covered = coveredByAncestor(b.dataset.node);
      b.disabled = covered;
      if (covered) b.checked = false;         // 상위만 보내면 서버가 하위까지 펼친다
      const label = b.closest('label');
      label.classList.toggle('covered', covered);
      let tag = label.querySelector('.incl');
      if (covered && !tag) {
        tag = document.createElement('span');
        tag.className = 'incl';
        tag.textContent = '상위에 포함됨';
        label.appendChild(tag);
      } else if (!covered && tag) tag.remove();
    });
  };

  dd.addEventListener('change', e => {
    const t = e.target;
    if (t.checked && 'exclusive' in t.dataset)
      dd.querySelectorAll('input:checked').forEach(i => { if (i !== t) i.checked = false; });
    else if (t.checked)
      dd.querySelectorAll('input[data-exclusive]:checked').forEach(i => i.checked = false);
    syncTree();
    refresh();
  });
  syncTree();
  refresh();
});
document.addEventListener('click', e => {
  document.querySelectorAll('details.dd[open]').forEach(dd => {
    if (!dd.contains(e.target)) dd.removeAttribute('open');
  });
});
</script>
</body>
</html>
